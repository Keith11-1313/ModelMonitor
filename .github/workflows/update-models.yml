name: Model Intelligence Update

on:
  schedule:
    # Trigger at minute 00 every hour.
    # The cadence gate below performs at most one completed refresh per
    # 6-hour UTC window: 00:00, 06:00, 12:00, 18:00 UTC.
    # If GitHub delays/misses a trigger or an update fails, the next :00
    # hourly trigger retries the same 6-hour window.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: model-intelligence-update
  cancel-in-progress: false

jobs:
  update-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      actions: read

    steps:
      - name: Decide whether this 6-hour window needs a refresh
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: forcing refresh."
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          slot_start_epoch="$((now_epoch / 21600 * 21600))"
          slot_start="$(date -u -d "@$slot_start_epoch" +%Y-%m-%dT%H:%M:%SZ)"

          runs="$(
            curl -fsSL               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPOSITORY/actions/workflows/update-models.yml/runs?per_page=20"
          )"

          already_completed=false

          while IFS= read -r run_id; do
            [[ -z "$run_id" ]] && continue
            [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue

            jobs="$(
              curl -fsSL                 -H "Accept: application/vnd.github+json"                 -H "Authorization: Bearer $GH_TOKEN"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100"
            )"

            if jq -e '
              .jobs[]
              | select(.name == "update-models")
              | .steps[]
              | select(.name == "Publish changed generated data" and .conclusion == "success")
            ' <<< "$jobs" >/dev/null; then
              already_completed=true
              break
            fi
          done < <(
            jq -r               --arg slot "$slot_start"               '.workflow_runs[]
               | select(.created_at >= $slot)
               | .id'               <<< "$runs"
          )

          if [[ "$already_completed" == "true" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "A completed refresh already exists in this 6-hour UTC window starting $slot_start."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No completed refresh exists in this 6-hour UTC window starting $slot_start. Running now."
          fi

      - uses: actions/checkout@v4
        if: steps.cadence.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.cadence.outputs.run == 'true'
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
        if: steps.cadence.outputs.run == 'true'

      - run: npm test
        if: steps.cadence.outputs.run == 'true'

      - run: npm run lint
        if: steps.cadence.outputs.run == 'true'

      - name: Collect model data
        if: steps.cadence.outputs.run == 'true'
        run: npm run fetch
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - run: npm run validate
        if: steps.cadence.outputs.run == 'true'

      - name: Publish changed generated data
        if: steps.cadence.outputs.run == 'true'
        run: |
          git add public/data/
          if git diff --cached --quiet; then
            echo "No generated data changes."
            exit 0
          fi

          git -c user.name='github-actions[bot]'               -c user.email='github-actions[bot]@users.noreply.github.com'               commit -m "chore(data): model intelligence update $(date -u +%Y-%m-%d)"
          git push
