name: Weekly Model Update

on:
  # Run Monday and Thursday at 02:00 UTC
  schedule:
    - cron: '0 2 * * 1'
    - cron: '0 2 * * 4'

  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-models:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to git push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run fetch-models script
        run: npm run fetch

      - name: Commit updated models.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/models.json
          # Exit cleanly if nothing changed (no new models this week)
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore(data): weekly model update $(date -u +%Y-%m-%d)"
          git push
