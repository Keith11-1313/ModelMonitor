name: Model Intelligence Update

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: model-intelligence-update
  cancel-in-progress: false

jobs:
  update-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run fetch
      - run: npm run validate
      - name: Publish changed generated data
        run: |
          git add public/data/
          if git diff --cached --quiet; then
            echo "No generated data changes."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m "chore(data): model intelligence update $(date -u +%Y-%m-%d)"
          git push
